[package]
name = "fl-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "FerroGate: Zero-knowledge AES-256-GCM agent secrets vault, outbound HTTP credential proxy, declarative API-to-MCP gateway, local MCP registry v0.1, and inbound/outbound event bridge."
repository = "https://github.com/Artificial-Humanity/FerroGate"

[dependencies]
base64 = "0.22"
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1"
ureq = { version = "3.4", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12"
